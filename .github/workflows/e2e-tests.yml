name: Runner E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly on Fridays at 14:00 UTC
    - cron: "0 14 * * 5"

jobs:
  shell-tests:
    runs-on: [github-runner-scale-set]
    steps:
      - name: System info
        run: |
          echo "Runner name: ${RUNNER_NAME}"
          echo "Pod arch: $(uname -m)"
          echo "$(uname --all)"
          docker buildx version

  build-container:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [github-runner-scale-set]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure buildx remote builder (buildkitd-github)
        run: |
          docker buildx create --name buildkit-github --driver remote \
            --driver-opt "cacert=/etc/buildkit/ca.pem" \
            --driver-opt "cert=/etc/buildkit/cert.pem" \
            --driver-opt "key=/etc/buildkit/key.pem" \
            "${BUILDKIT_HOST}"
          docker buildx use buildkit-github
          docker buildx inspect
      - name: Build Docker image for linux/${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --tag "e2e-test-image-${{ matrix.arch }}" .

  build-binary:
    runs-on: [github-runner-scale-set]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build native + cross-arch binaries
        run: |
          case "$(uname -m)" in
            x86_64)  native=amd64; cross=arm64 ;;
            aarch64) native=arm64; cross=amd64 ;;
            *) echo "Unsupported host architecture: $(uname -m)"; exit 1 ;;
          esac
          echo "native=$native cross=$cross"
          GOARCH="$native" go build -o test-binary-native main.go
          GOARCH="$cross"  go build -o test-binary-cross  main.go
          go version test-binary-native
          go version test-binary-cross
      - name: Run native binary
        run: ./test-binary-native
