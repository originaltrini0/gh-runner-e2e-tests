name: Runner E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  shell-tests:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    steps:
      - name: System info
        run: |
          echo "$(uname --all)"

  build-container:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          docker build --platform linux/${{ matrix.arch }} -t e2e-test-image-${{ matrix.arch }} .
          docker run --platform linux/${{ matrix.arch }} --rm e2e-test-image-${{ matrix.arch }}

  build-binary:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: [self-hosted, "${{ matrix.arch }}"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Go binary
        run: GOARCH=${{ matrix.arch }} go build -o test-binary main.go
      - name: Run Go binary
        run: ./test-binary
